<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe7">
  <title>今日清单</title>
  <style>
    :root {
      --bg: #f4efe7;
      --card: rgba(255, 253, 249, .88);
      --ink: #22201d;
      --muted: #817b72;
      --line: #ded7cd;
      --accent: #e95f3c;
      --accent-dark: #bf3f22;
      --green: #547a61;
      --shadow: 0 24px 70px rgba(72, 56, 38, .13);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 12%, rgba(233,95,60,.14), transparent 30%),
        radial-gradient(circle at 88% 90%, rgba(84,122,97,.16), transparent 34%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 36px 18px;
    }

    .app {
      width: min(100%, 720px);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    header { padding: 38px 38px 24px; }
    .eyebrow { color: var(--accent); font-weight: 800; letter-spacing: .12em; font-size: .72rem; text-transform: uppercase; }
    h1 { margin: 7px 0 4px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.3rem, 8vw, 4rem); line-height: 1; letter-spacing: -.045em; }
    .date { color: var(--muted); font-size: .96rem; }

    .composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin: 0 38px 24px; }
    .due-field { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .84rem; }
    .due-field input { width: auto; max-width: 100%; padding: 9px 12px; }
    .task-content { min-width: 0; }
    .task-due { display: block; margin-top: 5px; color: var(--muted); font-size: .78rem; }
    .task-due.overdue { color: var(--accent-dark); }
    .task-due.today { color: var(--accent-dark); font-weight: 700; }
    li.done .task-due { color: var(--muted); font-weight: 400; }

    input {
      width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 15px 17px;
      font: inherit; color: var(--ink); background: rgba(255,255,255,.72); outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(233,95,60,.12); }
    button { font: inherit; cursor: pointer; }
    .add {
      border: 0; border-radius: 14px; padding: 0 21px; color: white; background: var(--accent);
      font-weight: 750; box-shadow: 0 8px 20px rgba(233,95,60,.24); transition: transform .15s, background .2s;
    }
    .add:hover { background: var(--accent-dark); transform: translateY(-1px); }

    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 0 38px 18px; border-bottom: 1px solid var(--line); }
    .filters { display: flex; gap: 5px; background: #ece6dd; padding: 4px; border-radius: 11px; }
    .filter, .clear { border: 0; background: transparent; color: var(--muted); padding: 7px 11px; border-radius: 8px; font-size: .84rem; }
    .filter.active { background: white; color: var(--ink); box-shadow: 0 2px 8px rgba(50,40,30,.08); font-weight: 700; }
    .clear:hover { color: var(--accent-dark); }

    ul { list-style: none; padding: 10px 24px 14px; margin: 0; min-height: 220px; }
    li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 15px 14px; border-radius: 14px; }
    li:hover { background: rgba(255,255,255,.62); }
    .check { width: 22px; height: 22px; border: 1.8px solid #aaa197; border-radius: 7px; background: transparent; display: grid; place-items: center; color: white; padding: 0; }
    li.done .check { border-color: var(--green); background: var(--green); }
    .check svg { opacity: 0; }
    li.done .check svg { opacity: 1; }
    .task-text { overflow-wrap: anywhere; }
    li.done .task-text { text-decoration: line-through; color: #aaa39a; }
    .delete { opacity: 0; border: 0; background: transparent; color: #aca398; font-size: 1.2rem; line-height: 1; padding: 6px 8px; border-radius: 8px; }
    li:hover .delete, .delete:focus { opacity: 1; }
    .delete:hover { color: var(--accent); background: rgba(233,95,60,.08); }
    .empty { grid-template-columns: 1fr; place-items: center; color: var(--muted); text-align: center; padding: 62px 20px; }

    footer { display: flex; justify-content: space-between; align-items: center; padding: 17px 38px 24px; color: var(--muted); font-size: .84rem; }
    .progress { height: 4px; width: 110px; border-radius: 99px; background: #ded7cd; overflow: hidden; }
    .progress span { display: block; height: 100%; width: 0; background: var(--green); transition: width .25s ease; }

    @media (max-width: 560px) {
      .app { border-radius: 22px; }
      header { padding: 30px 22px 21px; }
      .composer { margin: 0 22px 20px; grid-template-columns: 1fr; }
      .add { min-height: 48px; }
      .toolbar { padding: 0 22px 16px; align-items: flex-start; flex-direction: column; }
      ul { padding-inline: 9px; }
      .delete { opacity: 1; }
      footer { padding-inline: 22px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="title">
    <header>
      <div class="eyebrow">Make space for what matters</div>
      <h1 id="title">今日清单</h1>
      <div class="date" id="date"></div>
    </header>

    <form class="composer" id="form">
      <input id="new-task" type="text" maxlength="120" autocomplete="off" placeholder="接下来要做什么？" aria-label="新任务" required>
      <button class="add" type="submit">添加任务</button>
      <label class="due-field" for="due-date">截止日期（可选）<input id="due-date" type="date" min="0001-01-01" max="9999-12-31"></label>
    </form>

    <section class="toolbar" aria-label="任务筛选">
      <div class="filters">
        <button class="filter active" data-filter="all" type="button">全部</button>
        <button class="filter" data-filter="active" type="button">待完成</button>
        <button class="filter" data-filter="done" type="button">已完成</button>
      </div>
      <button class="clear" id="clear" type="button">清除已完成</button>
    </section>

    <ul id="list" aria-live="polite"></ul>

    <footer>
      <span id="count">0 项待完成</span>
      <div class="progress" aria-label="完成进度"><span id="progress"></span></div>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = 'today-list-v1';
    const form = document.querySelector('#form');
    const input = document.querySelector('#new-task');
    const dueInput = document.querySelector('#due-date');
    const list = document.querySelector('#list');
    const count = document.querySelector('#count');
    const progress = document.querySelector('#progress');
    const filters = [...document.querySelectorAll('.filter')];
    let activeFilter = 'all';
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    document.querySelector('#date').textContent = new Intl.DateTimeFormat('zh-CN', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    }).format(new Date());

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
    function visible(task) { return activeFilter === 'all' || (activeFilter === 'done' ? task.done : !task.done); }

    function localDateKey(date = new Date()) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    function deadlineLabel(dueDate, done) {
      const today = localDateKey();
      const status = done ? '' : dueDate < today ? 'overdue' : dueDate === today ? 'today' : '';
      const suffix = status === 'overdue' ? ' · 已逾期' : status === 'today' ? ' · 今天到期' : '';
      return { status, text: `截止 ${dueDate}${suffix}` };
    }

    function render() {
      list.innerHTML = '';
      const shown = tasks.filter(visible);
      if (!shown.length) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = activeFilter === 'all' ? '清单还是空的，添加第一项吧。' : '这里暂时没有任务。';
        list.appendChild(empty);
      }

      shown.forEach(task => {
        const item = document.createElement('li');
        item.className = task.done ? 'done' : '';
        item.dataset.id = task.id;
        item.innerHTML = `
          <button class="check" type="button" aria-label="${task.done ? '标记为未完成' : '标记为已完成'}">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3 8 3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="task-content"><span class="task-text"></span></div>
          <button class="delete" type="button" aria-label="删除任务">×</button>`;
        item.querySelector('.task-text').textContent = task.text;
        if (task.dueDate) {
          const deadline = deadlineLabel(task.dueDate, task.done);
          const date = document.createElement('time');
          date.dateTime = task.dueDate;
          date.className = `task-due ${deadline.status}`;
          date.textContent = deadline.text;
          item.querySelector('.task-content').appendChild(date);
        }
        list.appendChild(item);
      });

      const remaining = tasks.filter(task => !task.done).length;
      count.textContent = `${remaining} 项待完成`;
      progress.style.width = tasks.length ? `${(tasks.length - remaining) / tasks.length * 100}%` : '0%';
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      tasks.unshift({ id: crypto.randomUUID(), text, done: false, dueDate: dueInput.value || null });
      input.value = '';
      dueInput.value = '';
      save(); render(); input.focus();
    });

    list.addEventListener('click', event => {
      const item = event.target.closest('li[data-id]');
      if (!item) return;
      const index = tasks.findIndex(task => task.id === item.dataset.id);
      if (event.target.closest('.check')) tasks[index].done = !tasks[index].done;
      if (event.target.closest('.delete')) tasks.splice(index, 1);
      save(); render();
    });

    filters.forEach(button => button.addEventListener('click', () => {
      activeFilter = button.dataset.filter;
      filters.forEach(item => item.classList.toggle('active', item === button));
      render();
    }));

    document.querySelector('#clear').addEventListener('click', () => {
      tasks = tasks.filter(task => !task.done);
      save(); render();
    });

    // Refresh date-sensitive labels when returning to the page and across midnight.
    window.addEventListener('focus', render);
    setInterval(render, 60_000);
    render();
  </script>
</body>
</html>
